[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "longchat-proxy"
version = "0.1.2"
description = "A transparent rolling-context proxy for OpenAI-compatible local LLM servers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Newton Lorenz" }]
keywords = ["llm", "lm-studio", "ollama", "llama-cpp", "context-window", "openai-api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Proxy Servers",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
tokenizers = ["tokenizers>=0.20,<1"]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
longchat-proxy = "longchat_proxy.cli:main"

[project.urls]
Homepage = "https://github.com/newtonlorenz/longchat-proxy"
Repository = "https://github.com/newtonlorenz/longchat-proxy"
Issues = "https://github.com/newtonlorenz/longchat-proxy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/longchat_proxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning:pytest_asyncio.plugin",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
